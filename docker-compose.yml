services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54321:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/, so the
      # volume mounts one level up. A new volume name keeps older-major data
      # (the old `postgres_data`) from blocking startup.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres18_data:
